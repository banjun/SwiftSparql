name: CI

on:
  push:
    branches: [ m@ster ]
  pull_request:
    branches: [ m@ster ]

jobs:
  build:
    runs-on: macOS-15
    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '^16.0.0'
    - uses: actions/checkout@v4
    - run: swift build
  podspec:
    runs-on: macOS-15
    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '^16.0.0'
    - uses: actions/checkout@v4
    - run: bundle update --bundler
    - run: bundle install
    - run: bundle exec pod lib lint
